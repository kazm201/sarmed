<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="url(#gradientBg)"/>
  <defs>
    <linearGradient id="gradientBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#059669"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Shopping Cart Base -->
  <path d="M120 140h40l36 180h180l30-140H190" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wheels -->
  <circle cx="210" cy="380" r="26" fill="#fbbf24"/>
  <circle cx="360" cy="380" r="26" fill="#fbbf24"/>
  <!-- Debt Ledger Icon / Sheet inside Cart -->
  <rect x="230" y="110" width="140" height="170" rx="16" fill="#ffffff" fill-opacity="0.95"/>
  <line x1="255" y1="150" x2="345" y2="150" stroke="#059669" stroke-width="12" stroke-linecap="round"/>
  <line x1="255" y1="185" x2="325" y2="185" stroke="#059669" stroke-width="10" stroke-linecap="round"/>
  <line x1="255" y1="220" x2="345" y2="220" stroke="#10b981" stroke-width="10" stroke-linecap="round"/>
  <!-- Checkmark / Currency Badge -->
  <circle cx="360" cy="120" r="32" fill="url(#goldGradient)"/>
  <path d="M350 120l8 8 16-16" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
